service: project-hub-api
frameworkVersion: "3"

useDotenv: true

plugins:
  - serverless-python-requirements

provider:
  name: aws
  runtime: python3.11
  architecture: arm64
  region: ${env:APP_AWS_REGION, 'ca-central-1'}
  stage: ${opt:stage, env:ENVIRONMENT, 'dev'}
  endpointType: regional
  # Logs are kept for a month instead of forever.
  logRetentionInDays: 30
  environment:
    APP_NAME: ${env:APP_NAME, 'Project Hub API'}
    ENVIRONMENT: ${env:ENVIRONMENT, self:provider.stage}
    # No password: the Lambda signs in as project_hub_app with an IAM token (DATABASE_IAM_AUTH).
    DATABASE_URL: ${env:APP_DATABASE_URL}
    DATABASE_IAM_AUTH: "true"
    AUTH_MODE: ${env:AUTH_MODE, 'cognito'}
    APP_AWS_REGION: ${self:provider.region}
    # The UI and API share one CloudFront origin, so the API needs no CORS.
    CORS_ORIGINS: ""
    # CloudFront sends this header to the API; requests made straight to execute-api don't have it.
    ORIGIN_VERIFY_SECRET:
      Fn::Sub: "{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}"
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID, ''}
    COGNITO_ADDITIONAL_CLIENT_IDS: ${env:COGNITO_ADDITIONAL_CLIENT_IDS, ''}
    COGNITO_DOMAIN: ${env:COGNITO_DOMAIN, ''}
    # The pool is invite-only, so adding a user must create them in Cognito (AdminCreateUser emails the invite).
    COGNITO_INVITE_ENABLED: "true"
    COGNITO_APP_CLIENT_SECRET_PARAM: /project-hub/${sls:stage}/cognito-app-client-secret
    # Stripe: secrets in SSM (read at startup; billing stays switched off until they exist), price IDs from
    # scripts/setup_stripe_prices.py, and the UI's URL for Checkout and the billing portal to return to.
    STRIPE_SECRET_KEY_PARAM: /project-hub/${sls:stage}/stripe-secret-key
    STRIPE_WEBHOOK_SECRET_PARAM: /project-hub/${sls:stage}/stripe-webhook-secret
    STRIPE_FULL_SEAT_PRICE_ID: ${env:STRIPE_FULL_SEAT_PRICE_ID, ''}
    STRIPE_VIEWER_SEAT_PRICE_ID: ${env:STRIPE_VIEWER_SEAT_PRICE_ID, ''}
    STRIPE_AI_USAGE_PRICE_ID: ${env:STRIPE_AI_USAGE_PRICE_ID, ''}
    BILLING_CURRENCY: CAD
    APP_URL: ${env:APP_URL, ''}
    # Notification emails (SES). Until EMAIL_FROM is set to a verified SES identity, nothing is queued or sent.
    EMAIL_FROM: ${env:EMAIL_FROM, ''}
    SES_CONFIGURATION_SET:
      Ref: EmailConfigurationSet
    # Signs unsubscribe links.
    EMAIL_TOKEN_SECRET:
      Fn::Sub: "{{resolve:secretsmanager:${EmailTokenSecret}:SecretString:value}}"
    S3_BUCKET_NAME:
      Ref: AttachmentsBucket
    # AI assistant: accounts' own model keys are encrypted with this key. The API may only encrypt;
    # only the AI worker's role (AiWorkerRole) may decrypt.
    AI_KMS_KEY_ID:
      Fn::GetAtt: [AiKeysKmsKey, Arn]
    # Questions are answered by the aiAssistant function, started asynchronously by the API.
    AI_WORKER_FUNCTION: ${self:service}-${sls:stage}-aiAssistant
    # The platform's own provider keys for platform-provided models: SSM SecureStrings named
    # <prefix><provider>-api-key (openai, anthropic, gemini), read by the AI worker only when needed.
    AI_PLATFORM_KEY_PARAM_PREFIX: /project-hub/${sls:stage}/ai/
    # Slack, Teams and Microsoft 365. Tokens customers connect are encrypted with IntegrationKmsKey. The platform's
    # own app secrets are SSM SecureStrings under INTEGRATION_SECRETS_PATH (slack-client-secret,
    # slack-signing-secret, microsoft-client-secret, teams-bot-password, state-secret); each integration stays
    # off until its IDs below and its secrets exist. See README "Integrations".
    INTEGRATION_KMS_KEY_ID:
      Fn::GetAtt: [IntegrationKmsKey, Arn]
    INTEGRATION_SECRETS_PATH: /project-hub/${sls:stage}/integrations/
    SLACK_CLIENT_ID: ${env:SLACK_CLIENT_ID, ''}
    MICROSOFT_CLIENT_ID: ${env:MICROSOFT_CLIENT_ID, ''}
    TEAMS_BOT_APP_ID: ${env:TEAMS_BOT_APP_ID, ''}
    TEAMS_BOT_TENANT: ${env:TEAMS_BOT_TENANT, 'botframework.com'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - Fn::Join: ["", [{ "Fn::GetAtt": [AttachmentsBucket, Arn] }, "/*"]]
        - Effect: Allow
          Action: rds-db:connect
          Resource:
            - Fn::Sub: arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/project_hub_app
        - Effect: Allow
          Action: cognito-idp:AdminCreateUser
          Resource:
            - Fn::Sub: arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${env:COGNITO_USER_POOL_ID, ''}
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource:
            - Fn::Sub: arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
            - Fn::Sub: arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${EmailConfigurationSet}
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
            - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/project-hub/${sls:stage}/*
        - Effect: Allow
          Action: ssm:GetParametersByPath
          Resource:
            - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/project-hub/${sls:stage}/integrations
        - Effect: Allow
          Action: kms:Encrypt
          Resource:
            - Fn::GetAtt: [AiKeysKmsKey, Arn]
        # Slack bot tokens and Microsoft refresh tokens: the API stores and uses them, the workers send with them.
        - Effect: Allow
          Action:
            - kms:Encrypt
            - kms:Decrypt
          Resource:
            - Fn::GetAtt: [IntegrationKmsKey, Arn]
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource:
            - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-aiAssistant

functions:
  api:
    handler: app.main.handler
    description: Project Hub FastAPI app served by Mangum behind API Gateway HTTP API.
    # 1769 MB is one full vCPU. Startup is CPU-bound (importing the app), and at 512 MB it took 2.5–5 s.
    memorySize: 1769
    timeout: 28
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

  # Notification emails are queued on the notification row during the request and sent from here
  # (app/worker.py), so SES never slows down or breaks an API call.
  notificationEmails:
    handler: app.worker.deliver_handler
    description: Sends queued "right away" notification emails.
    memorySize: 1024
    timeout: 60
    events:
      - schedule: rate(1 minute)

  # Hourly, because "8 am" happens at a different UTC hour in each person's timezone.
  morningNotifications:
    handler: app.worker.morning_handler
    description: Creates due-soon reminders and sends daily digests for people whose digest hour has come.
    memorySize: 1024
    timeout: 300
    events:
      - schedule: cron(5 * * * ? *)

  # Answers one assistant question per invocation (app/services/ai/runner.py). Started asynchronously by the
  # API, so a slow model never meets the API's 28-second limit. Its own role is the only one that can decrypt
  # accounts' model keys.
  aiAssistant:
    handler: app.worker.ai_run_handler
    description: Answers one AI assistant question or writes one report, with the account's model.
    memorySize: 1024
    # The run gives up after AI_RUN_TIMEOUT_SECONDS (120); the extra time lets it record why.
    timeout: 150
    # Failures are recorded on the run; an automatic retry would answer the same question twice.
    maximumRetryAttempts: 0
    role: AiWorkerRole

  # Hourly: marks runs whose worker died as failed and deletes conversations past their account's retention.
  aiHousekeeping:
    handler: app.worker.ai_housekeeping_handler
    description: Cleans up stale AI runs and expired conversations.
    memorySize: 512
    timeout: 120
    events:
      - schedule: cron(15 * * * ? *)

  # Slack and Teams: queues channel updates from the activity log and sends queued messages (app/worker.py).
  integrations:
    handler: app.worker.integrations_handler
    description: Sends project updates and direct messages to Slack and Microsoft Teams.
    memorySize: 1024
    timeout: 60
    events:
      - schedule: rate(1 minute)

  # Keeps connected Outlook calendars in line with people's due dates and milestones.
  calendarSync:
    handler: app.worker.calendar_sync_handler
    description: Updates connected Outlook calendars through Microsoft Graph.
    memorySize: 1024
    timeout: 300
    events:
      - schedule: rate(15 minutes)

  sesEvents:
    handler: app.worker.ses_events_handler
    description: Records SES hard bounces and complaints so those addresses aren't emailed again.
    memorySize: 512
    timeout: 30
    events:
      - sns:
          arn:
            Ref: EmailEventsTopic
          topicName: ${self:service}-${sls:stage}-email-events

package:
  patterns:
    - "!**"
    - app/**
    - requirements.txt
    # CI compiles app/ to hash-checked .pyc just before deploying (see deploy-dev.yml).
    - "!app/migrations/**/__pycache__/**"
    - "!tests/**"
    - "!screenshots/**"

custom:
  pythonRequirements:
    fileName: requirements.txt
    # Linux arm64 wheels are fetched directly, so packaging works the same on Windows, macOS and CI.
    dockerizePip: false
    pipCmdExtraArgs:
      - --platform=manylinux2014_aarch64
      - --implementation=cp
      - --python-version=3.11
      - "--only-binary=:all:"
    # pip also writes .pyc files. Lambda's code directory is read-only, so without them every cold start
    # recompiles all dependencies (seconds). They only match the runtime when packaging runs on Python 3.11, as CI does.
    slim: false
    strip: false
    useDownloadCache: false
    useStaticCache: false
    noDeploy:
      # Already in the Lambda Python runtime.
      - boto3
      - pytest
      - httpx
      - uvicorn
# The UI and the API share one CloudFront address: the session cookies are SameSite=Strict, and
# cloudfront.net / execute-api.amazonaws.com are public suffixes, so separate hosts would be cross-site.
#   /*      -> private S3 bucket with the Vite build (deployed by the UI repo's workflow)
#   /api/*  -> this stack's HTTP API
resources:
  Conditions:
    HasAlarmEmail:
      Fn::Not:
        - Fn::Equals: ["${env:ALARM_EMAIL, ''}", ""]

  Resources:
    # Shared between CloudFront (sent as X-Origin-Verify) and the Lambda (checked on every request).
    OriginVerifySecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: /project-hub/${sls:stage}/origin-verify
        Description: Header value CloudFront adds to API requests so direct execute-api calls are refused.
        GenerateSecretString:
          SecretStringTemplate: "{}"
          GenerateStringKey: value
          PasswordLength: 48
          ExcludePunctuation: true

    EmailTokenSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: /project-hub/${sls:stage}/email-token
        Description: Signs the unsubscribe links in notification emails.
        GenerateSecretString:
          SecretStringTemplate: "{}"
          GenerateStringKey: value
          PasswordLength: 48
          ExcludePunctuation: true

    # Encrypts accounts' own AI model keys (app/services/ai/keys.py). The account id is the encryption context.
    AiKeysKmsKey:
      Type: AWS::KMS::Key
      Properties:
        Description: Encrypts Project Hub accounts' own AI model API keys.
        EnableKeyRotation: true
        KeyPolicy:
          Version: "2012-10-17"
          Statement:
            # Lets IAM policies grant use of the key (the API role: encrypt; AiWorkerRole: decrypt).
            - Sid: EnableIamPolicies
              Effect: Allow
              Principal:
                AWS:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
              Action: kms:*
              Resource: "*"

    # The AI worker's role: everything the API role has that the worker needs, plus decrypting model keys.
    AiWorkerRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: ai-worker
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: rds-db:connect
                  Resource:
                    - Fn::Sub: arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/project_hub_app
                - Effect: Allow
                  Action: ssm:GetParameter
                  Resource:
                    - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/project-hub/${sls:stage}/*
                - Effect: Allow
                  Action: kms:Decrypt
                  Resource:
                    - Fn::GetAtt: [AiKeysKmsKey, Arn]

    # Encrypts tokens customers connect (Slack bot tokens, Microsoft refresh tokens), with the owning account or
    # person as encryption context (app/services/integrations/secrets.py).
    IntegrationKmsKey:
      Type: AWS::KMS::Key
      Properties:
        Description: Encrypts Project Hub integration tokens (Slack, Microsoft 365).
        EnableKeyRotation: true
        KeyPolicy:
          Version: "2012-10-17"
          Statement:
            - Sid: EnableIamPolicies
              Effect: Allow
              Principal:
                AWS:
                  Fn::Sub: arn:aws:iam::${AWS::AccountId}:root
              Action: kms:*
              Resource: "*"

    IntegrationKmsAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/project-hub-${sls:stage}-integrations
        TargetKeyId:
          Ref: IntegrationKmsKey

    AiKeysKmsAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/project-hub-${sls:stage}-ai-keys
        TargetKeyId:
          Ref: AiKeysKmsKey

    # Every notification email is sent with this configuration set, which publishes bounces and complaints.
    EmailConfigurationSet:
      Type: AWS::SES::ConfigurationSet
      Properties:
        Name: ${self:service}-${sls:stage}

    EmailEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-email-events

    EmailEventsTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics: [{ Ref: EmailEventsTopic }]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowSesPublish
              Effect: Allow
              Principal:
                Service: ses.amazonaws.com
              Action: sns:Publish
              Resource:
                Ref: EmailEventsTopic
              Condition:
                StringEquals:
                  AWS:SourceAccount:
                    Ref: AWS::AccountId

    EmailEventDestination:
      Type: AWS::SES::ConfigurationSetEventDestination
      DependsOn: EmailEventsTopicPolicy
      Properties:
        ConfigurationSetName:
          Ref: EmailConfigurationSet
        EventDestination:
          Name: bounces-and-complaints
          Enabled: true
          MatchingEventTypes: [bounce, complaint]
          SnsDestination:
            TopicARN:
              Ref: EmailEventsTopic

    UiBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    UiBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: UiBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudFrontRead
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource:
                Fn::Join: ["", [{ "Fn::GetAtt": [UiBucket, Arn] }, "/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn:
                    Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${AppDistribution}

    AttachmentsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        # The browser uploads and downloads attachments directly with presigned URLs.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [GET, PUT, HEAD]
              AllowedOrigins:
                - Fn::Sub: https://${AppDistribution.DomainName}
                - http://localhost:5173
              AllowedHeaders: ["*"]
              ExposedHeaders: [ETag]
              MaxAge: 3000

    UiOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-ui
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    # Client-side routes (/projects/123, /auth/callback) have no file extension; serve index.html for them.
    # Done here rather than with 403/404 error pages so API error responses under /api pass through untouched.
    SpaRewriteFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: ${self:service}-${sls:stage}-spa-rewrite
        AutoPublish: true
        FunctionConfig:
          Comment: Serve index.html for client-side routes
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          function handler(event) {
            var request = event.request;
            var lastSegment = request.uri.split('/').pop();
            if (lastSegment.indexOf('.') === -1) {
              request.uri = '/index.html';
            }
            return request;
          }

    # 'unsafe-inline' styles: the rich-text editor and PDF export write inline style attributes.
    # img-src allows https: because profile photos can be any image URL.
    SecurityHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:service}-${sls:stage}-security-headers
          SecurityHeadersConfig:
            StrictTransportSecurity:
              AccessControlMaxAgeSec: 31536000
              IncludeSubdomains: false
              Preload: false
              Override: true
            ContentTypeOptions:
              Override: true
            FrameOptions:
              FrameOption: DENY
              Override: true
            ReferrerPolicy:
              ReferrerPolicy: strict-origin-when-cross-origin
              Override: true
            ContentSecurityPolicy:
              Override: true
              ContentSecurityPolicy:
                Fn::Join:
                  - "; "
                  - - default-src 'self'
                    - script-src 'self'
                    - style-src 'self' 'unsafe-inline'
                    - "img-src 'self' data: blob: https:"
                    - "font-src 'self' data:"
                    # Presigned attachment uploads. A wildcard, because naming AttachmentsBucket here would
                    # be circular (its CORS rule names this distribution).
                    - Fn::Sub: connect-src 'self' https://*.s3.${AWS::Region}.amazonaws.com https://*.s3.amazonaws.com
                    - object-src 'none'
                    - base-uri 'self'
                    - form-action 'self'
                    - frame-ancestors 'none'
          CustomHeadersConfig:
            Items:
              - Header: Permissions-Policy
                Value: camera=(), microphone=(), geolocation=()
                Override: true

    AppDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: Project Hub ${sls:stage} (UI + API)
          HttpVersion: http2and3
          PriceClass: PriceClass_100
          DefaultRootObject: index.html
          Origins:
            - Id: ui
              DomainName:
                Fn::GetAtt: [UiBucket, RegionalDomainName]
              OriginAccessControlId:
                Ref: UiOriginAccessControl
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: api
              DomainName:
                Fn::Sub: ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
              OriginCustomHeaders:
                - HeaderName: X-Origin-Verify
                  HeaderValue:
                    Fn::Sub: "{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}"
          DefaultCacheBehavior:
            TargetOriginId: ui
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
            ResponseHeadersPolicyId:
              Ref: SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN:
                  Fn::GetAtt: [SpaRewriteFunction, FunctionMetadata.FunctionARN]
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              Compress: true
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
              ResponseHeadersPolicyId:
                Ref: SecurityHeadersPolicy

    # Alarms go to this topic; ALARM_EMAIL (a GitHub variable) subscribes an inbox, which must confirm by email.
    AlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-alarms
        Subscription:
          Fn::If:
            - HasAlarmEmail
            - - Protocol: email
                Endpoint: ${env:ALARM_EMAIL, ''}
            - Ref: AWS::NoValue

    LambdaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-lambda-errors
        AlarmDescription: The API Lambda crashed or timed out.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: ApiLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [{ Ref: AlarmTopic }]
        OKActions: [{ Ref: AlarmTopic }]

    LambdaThrottlesAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-lambda-throttles
        AlarmDescription: The API Lambda is being throttled.
        Namespace: AWS/Lambda
        MetricName: Throttles
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: ApiLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [{ Ref: AlarmTopic }]
        OKActions: [{ Ref: AlarmTopic }]

    NotificationEmailsErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-notification-emails-errors
        AlarmDescription: The notification email sender crashed or timed out three runs in a row.
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value:
              Ref: NotificationEmailsLambdaFunction
        Statistic: Sum
        Period: 180
        EvaluationPeriods: 1
        Threshold: 3
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [{ Ref: AlarmTopic }]
        OKActions: [{ Ref: AlarmTopic }]

    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-api-5xx
        AlarmDescription: The API returned three or more 5xx responses in five minutes.
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value:
              Ref: HttpApi
          - Name: Stage
            Value: $default
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 3
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [{ Ref: AlarmTopic }]
        OKActions: [{ Ref: AlarmTopic }]

    # The database isn't part of this stack, so it is referred to by its identifier.
    DbCpuAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-db-cpu
        AlarmDescription: Database CPU has been above 80% for 15 minutes.
        Namespace: AWS/RDS
        MetricName: CPUUtilization
        Dimensions:
          - Name: DBInstanceIdentifier
            Value: ${env:DB_INSTANCE_ID, 'project-hub-db'}
        Statistic: Average
        Period: 300
        EvaluationPeriods: 3
        Threshold: 80
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: missing
        AlarmActions: [{ Ref: AlarmTopic }]
        OKActions: [{ Ref: AlarmTopic }]

    DbStorageAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-db-storage
        AlarmDescription: Database free storage is below 2 GiB.
        Namespace: AWS/RDS
        MetricName: FreeStorageSpace
        Dimensions:
          - Name: DBInstanceIdentifier
            Value: ${env:DB_INSTANCE_ID, 'project-hub-db'}
        Statistic: Minimum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 2147483648
        ComparisonOperator: LessThanThreshold
        TreatMissingData: missing
        AlarmActions: [{ Ref: AlarmTopic }]
        OKActions: [{ Ref: AlarmTopic }]

  Outputs:
    AppUrl:
      Value:
