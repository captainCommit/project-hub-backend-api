name: Run Backend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_NAME: Project Hub API
      ENVIRONMENT: local
      AUTH_MODE: local
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/project_hub
      AWS_REGION: ca-central-1
      COGNITO_USER_POOL_ID: test-user-pool
      COGNITO_APP_CLIENT_ID: test-client-id
      S3_BUCKET_NAME: test-bucket

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d project_hub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          python -m pytest