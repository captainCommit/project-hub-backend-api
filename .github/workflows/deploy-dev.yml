name: Deploy Dev API

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role, no stored access keys

concurrency:
  group: deploy-dev-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: local
      AUTH_MODE: local
      # Tests use their own in-memory SQLite; this only satisfies settings at import time.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/project_hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: dev

    env:
      APP_NAME: Project Hub API
      ENVIRONMENT: dev
      AUTH_MODE: cognito
      APP_AWS_REGION: ca-central-1
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
      COGNITO_ADDITIONAL_CLIENT_IDS: ${{ vars.COGNITO_ADDITIONAL_CLIENT_IDS }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
      COGNITO_APP_CLIENT_SECRET: ${{ secrets.COGNITO_APP_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: pip install -r requirements.txt

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1

      # Migrations run before the new code goes live, so they must stay compatible with the running version.
      - name: Run database migrations
        run: alembic upgrade head

      - name: Deploy
        run: npx serverless deploy --stage dev

      - name: Show app URL
        run: |
          aws cloudformation describe-stacks --stack-name project-hub-api-dev \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text
