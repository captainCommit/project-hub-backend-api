name: Deploy Dev API

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS role, no stored access keys

concurrency:
  group: deploy-dev-api
  cancel-in-progress: false

jobs:
  # Real Postgres: migrations are applied from scratch, then the test suite runs.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: dev

    env:
      APP_NAME: Project Hub API
      ENVIRONMENT: dev
      AUTH_MODE: cognito
      APP_AWS_REGION: ca-central-1
      # Passwordless URL for the Lambda; it signs in with an IAM token.
      APP_DATABASE_URL: ${{ vars.APP_DATABASE_URL }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_APP_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
      COGNITO_ADDITIONAL_CLIENT_IDS: ${{ vars.COGNITO_ADDITIONAL_CLIENT_IDS }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
      STRIPE_FULL_SEAT_PRICE_ID: ${{ vars.STRIPE_FULL_SEAT_PRICE_ID }}
      STRIPE_VIEWER_SEAT_PRICE_ID: ${{ vars.STRIPE_VIEWER_SEAT_PRICE_ID }}
      # Metered price for platform AI usage (scripts/setup_stripe_ai_usage.py). Unset: AI usage isn't invoiced,
      # so accounts on the platform model stop at their free allowance.
      STRIPE_AI_USAGE_PRICE_ID: ${{ vars.STRIPE_AI_USAGE_PRICE_ID }}
      APP_URL: ${{ vars.APP_URL }}
      # Sender for notification emails, e.g. "Project Hub <notifications@example.com>"; must be verified in SES.
      # Leave unset to keep email off.
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      # Integrations: public app IDs (secrets are in SSM under /project-hub/dev/integrations/). Unset: that
      # integration stays off.
      SLACK_CLIENT_ID: ${{ vars.SLACK_CLIENT_ID }}
      MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
      TEAMS_BOT_APP_ID: ${{ vars.TEAMS_BOT_APP_ID }}
      TEAMS_BOT_TENANT: ${{ vars.TEAMS_BOT_TENANT || 'botframework.com' }}
      # Inbox for CloudWatch alarm emails (confirm the SNS subscription once).
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: pip install -r requirements.txt

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1

      # Migrations run before the new code goes live, so they must stay compatible with the running version.
      # Only the migration step gets the admin password; it never reaches the Lambda.
      - name: Run database migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Ship bytecode so cold starts don't recompile everything. SOURCE_DATE_EPOCH makes pip and compileall
      # write hash-checked .pyc files, which stay valid whatever file times the Lambda zip ends up with.
      - name: Deploy
        run: |
          python -m compileall -q app
          npx serverless deploy --stage dev
        env:
          SOURCE_DATE_EPOCH: "315532800"

      - name: Show app URL
        run: |
          aws cloudformation describe-stacks --stack-name project-hub-api-dev \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text
